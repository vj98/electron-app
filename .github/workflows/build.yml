name: Build Electron App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js (use Node.js v18.17.0 for compatibility)
        uses: actions/setup-node@v3
        with:
          node-version: "18.17.0" # Explicitly match your local Node.js version

      - name: Install Python 3.11 (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          # Install Python 3.11 on macOS
          brew install python@3.11

          # Ensure pip and setuptools are installed and updated
          /opt/homebrew/bin/python3.11 -m ensurepip --upgrade
          /opt/homebrew/bin/python3.11 -m pip install --upgrade pip setuptools

          # Set Python for npm/node-gyp to use
          npm config set python "/opt/homebrew/bin/python3.11"

      - name: Install Python 3.11 (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install Python 3.11 on Ubuntu
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-venv python3.11-distutils

          # Ensure pip and setuptools are installed and updated
          python3.11 -m ensurepip --upgrade
          python3.11 -m pip install --upgrade pip setuptools

          # Set Python for npm/node-gyp to use
          npm config set python "/usr/bin/python3.11"

      - name: Log Node and Python Versions
        run: |
          node -v
          npm -v
          python3 --version || echo "Python3 not found"
          echo "Python path for node-gyp: $(npm config get python)"

      - name: Install Dependencies (with logging)
        run: |
          echo "Starting npm install..."
          npm install > npm_install_log.txt 2>&1 || (cat npm_install_log.txt && exit 1)

      - name: Build Application (with logging)
        run: |
          echo "Starting build..."
          npm run dist > build_log.txt 2>&1 || (cat build_log.txt && exit 1)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: electron-app-${{ matrix.os }}
          path: dist
