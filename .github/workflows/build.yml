name: Electron App Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

    strategy:
      matrix:
        os: [windows-latest]
        arch: [x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          check-latest: true

      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules
        run: npx electron-rebuild

      - name: Run build
        run: npm run build

      - name: Install Squirrel Maker
        run: npm install --save-dev @electron-forge/maker-squirrel

      - name: Install Mono and Wine
        run: sudo apt-get update && sudo apt-get install -y mono-complete wine

      - name: Package application
        run: npm run make -- --platform=win32 --arch=x64 --targets=@electron-forge/maker-squirrel --authors='Vijay' --version='1.0.0'

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: electron-artifacts
          path: out/make/**/*
