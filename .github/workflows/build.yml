name: Electron App Build
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

on: [push, pull_request]

jobs:
  build_on_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          check-latest: true
      - name: install dependencies
        run: npm install
      - name: build
        run: npm run make -- --platform=linux --arch=x64

  build_on_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          check-latest: true
      - name: install dependencies
        run: npm install
      - name: build
        run: npm run make -- --platform=darwin --arch=x64

  build_on_win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          check-latest: true
      - name: install dependencies
        run: npm install
      - name: build
        run: npm run make -- --platform=win32 --arch=x64
