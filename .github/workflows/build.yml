name: Build Electron App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v3 # Updated to v3 for Node.js 16 support

      - name: Set up Node.js
        uses: actions/setup-node@v3 # Updated to v3 for Node.js 16 support
        with:
          node-version: "16" # Specify Node.js version 16, compatible with Electron 23

      - name: Install dependencies
        run: npm install

      - name: Build application with electron-builder
        run: npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3 # Ensure we're using the latest version here as well
        with:
          name: electron-app-${{ matrix.os }}
          path: dist
