name: Build and Publish
on: [push, pull_request]

jobs:
  build_on_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18"
          check-latest: true
      - name: Install dependencies
        run: npm install
      - name: Install Python Distutils
        if: runner.os == 'macOS'
        run: brew install python@3.9 && python3.9 -m ensurepip && python3.9 -m pip install setuptools
      - name: Build on Linux
        run: npm run make
      - name: Publish on Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

  build_on_mac:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18"
          check-latest: true
      - name: Install dependencies
        run: npm install
      - name: Install Python Distutils
        if: runner.os == 'macOS'
        run: brew install python@3.9 && python3.9 -m ensurepip && python3.9 -m pip install setuptools
      - name: Build on MacOS
        run: npm run make
      - name: Publish on MacOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

  build_on_win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18"
          check-latest: true
      - name: Install Node tools
        run: npm install
      - name: Install Python Distutils
        if: runner.os == 'macOS'
        run: brew install python@3.9 && python3.9 -m ensurepip && python3.9 -m pip install setuptools --global --production windows-build-tools@4.0.0
      - name: Install node-gyp
        run: npm install
      - name: Install Python Distutils
        if: runner.os == 'macOS'
        run: brew install python@3.9 && python3.9 -m ensurepip && python3.9 -m pip install setuptools --global node-gyp@latest
      - name: Set Node config to use Python 2.7
        run: npm config set python python2.7
      - name: Set Node config to MSVS version 2015
        run: npm config set msvs_version 2015
      - name: Install dependencies
        run: npm install
      - name: Install Python Distutils
        if: runner.os == 'macOS'
        run: brew install python@3.9 && python3.9 -m ensurepip && python3.9 -m pip install setuptools
      - name: Build on Windows
        run: npm run make
      - name: Publish on Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
